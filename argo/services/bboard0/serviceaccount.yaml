apiVersion: v1
kind: ServiceAccount
metadata:
  name: bboard0-sa
  labels:
    app.kubernetes.io/name: bboard0
  annotations:
    # IRSA: pod assumes this role to reach the sdk-bulletin-board S3 bucket. Role +
    # its S3 policy live in infra-terraform (aws/iam_sdk_apps_irsa.tf); access is also
    # granted by the bucket policy (config_texts s3_buckets). No namespace here — Argo
    # injects the Application's destination namespace (sdk-apps-dev).
    eks.amazonaws.com/role-arn: arn:aws:iam::368076259134:role/sdk-apps-dev-bboard0-irsa
